
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FE0000">
  <title>Rowwen Hèze – Kaart</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <img class="site-logo" src="assets/SC%20logo.png" alt="Rowwen Hèze SC-logo">
      <div class="header-copy">
        <h1 id="page-title">Rowwen Hèze – Kaart</h1>
        <p class="header-note">
          Mist er een groep, app mij huisje en naam van groep door, dan voeg ik m toe
        </p>
      </div>
    </div>
  </header>

  <main>
    <section class="map-section" aria-label="Kaart">
      <div class="map-toolbar">

        <div class="zoom-controls" aria-label="Kaartbediening">
          <button id="zoom-out" type="button" aria-label="Uitzoomen">
            −
          </button>
          <button id="zoom-reset" type="button">
            Reset
          </button>
          <button id="zoom-in" type="button" aria-label="Inzoomen">
            +
          </button>
        </div>
      </div>

      <div
        id="map-viewport"
        class="map-viewport"
        tabindex="0"
        role="region"
        aria-label="Interactieve kaart. Sleep om te verplaatsen en gebruik de muiswiel om in te zoomen."
      >
		<img
		  id="map"
		  src="assets/kaart.png"
		  alt="Plattegrond"
		  draggable="false"
		>
        <p id="map-error" class="map-error" hidden>
          De kaart kon niet worden geladen. Controleer de bestandsnaam
          en de locatie van de afbeelding.
        </p>
      </div>
    </section>

    <section class="legend-section" aria-labelledby="legend-title">
      <h2 id="legend-title">Legenda</h2>
      <div id="legend" class="legend-grid">
        <p>Legenda laden…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="footer-easter-egg" aria-hidden="true"></span>
    <p id="footer-text">
      Made by Briezert
    </p>
  </footer>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "64d7187278ba47369566764d1b6e7990"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
